<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>이차 — 준비 중</title>
<link rel="icon" href="assets/art/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --bg:#f7f4ee; --panel:#fcfaf5; --fg:#24211d; --fg-2:#3f3a34; --outline:#2b2823; --navy:#1f2d40; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 20px 60px; }
  .logo { width:110px; height:auto; display:block; margin:0 auto 18px; }
  h1 { font-size:26px; line-height:1.35; margin:0 0 14px; text-align:center; font-weight:900; }
  p { font-size:17px; line-height:1.85; color:var(--fg-2); margin:0 0 14px; }
  .panel { background:var(--panel); border:2px solid var(--outline); border-radius:14px; padding:20px; margin:22px 0; }
  .panel b { color:var(--fg); }
  a.btn { display:block; text-align:center; background:var(--navy); color:#fff; font-weight:700; font-size:17px; padding:15px 18px; border-radius:14px; text-decoration:none; margin-top:10px; }
  a.link { display:block; text-align:center; margin-top:18px; color:var(--fg); font-weight:700; }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/art/logo.webp" alt="이차">
  <h1>이 화면은 서버가 있어야 열려요</h1>
  <p>지금 보고 계신 주소는 GitHub 이 파일만 보여 주는 정적 페이지라, 매장 안내·지도·이용 안내까지만 돌아가요.</p>
  <div class="panel">
    <p><b>영수증 인증, 쿠폰함, 직원 확인, 관리자 화면</b>은 사진을 읽고 쿠폰을 저장하는 서버가 필요해서 여기서는 동작하지 않아요. 서버 배포본 주소가 생기면 이 자리에서 바로 연결돼요.</p>
  </div>
  <a class="btn" href="index.html">홈으로 돌아가기</a>
  <a class="link" href="guide.html">이용 안내 보기</a>
</main>
</body>
</html>
