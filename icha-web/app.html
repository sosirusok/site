<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>이차 — 곧 시작해요</title>
<link rel="icon" href="assets/art/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --bg:#f7f4ee; --fg:#24211d; --fg-2:#3f3a34; --navy:#1f2d40; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:64px 20px 60px; text-align:center; }
  .logo { width:120px; height:auto; display:block; margin:0 auto 22px; }
  h1 { font-size:26px; line-height:1.35; margin:0 0 12px; font-weight:900; }
  p { font-size:17px; line-height:1.8; color:var(--fg-2); margin:0 0 26px; }
  a.btn { display:block; background:var(--navy); color:#fff; font-weight:700; font-size:17px; padding:15px 18px; border-radius:14px; text-decoration:none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/art/logo.webp" alt="이차">
  <h1>영수증 인증은 곧 시작해요</h1>
  <p>준비되면 세 집 어디서든 영수증 한 장으로 옆집에서 한 잔 받을 수 있어요.</p>
  <a class="btn" href="index.html">홈으로</a>
</main>
</body>
</html>
